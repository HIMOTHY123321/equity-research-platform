[project]
name = "ai-market-desk-api"
version = "0.1.0"
description = "AI Market Desk - analysis backend"
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# UP007/UP037: `X | Y` unions are rejected at runtime by SQLAlchemy's annotation
# resolver on Python 3.9, so Optional[X] is intentional here, not stale style.
ignore = ["UP007", "UP037"]
